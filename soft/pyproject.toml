[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-digital"
version = "1.0.0"
description = "Production-ready Flask application for Nexus Digital's public website and inquiry workflows."
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
